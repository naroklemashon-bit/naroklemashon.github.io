<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    font-family: 'Poppins', sans-serif;
    margin: 0;
    padding: 0;
    box-sizing: border-box;

}
        

.form-header{
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    color: rgb(41, 36, 36);
    font-size: 32px;
    font-weight: bold;
    margin-top: 16px;
}
.designer-credit{
    overflow: scroll;
}
.designer{
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    color: rgb(41, 36, 36);
    text-align: center;
    margin-bottom: 16px;
}
body{
    background-color: rgb(201, 179, 223);
    width: 100%;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}
.container {
    background-color: rgba(0, 0, 0, 0.1);
    width: 320px;
    padding: 32px;
    border-radius: 16px;
    border: 5px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    box-shadow: 0px 0px 30px 20px rgba(0, 0, 0, 0.1);
    display: flex;
    color: white;
    flex-direction: column;
    align-items: center;
}

.login-title{
    margin-bottom: 16px;    
}

.input-box{
    width: 100%;
    margin-top: 20px;
    display: flex;
    position: relative;
}   

.input-box > input{  
    
    width: 100%;
    padding: 12px 16px;
    border-radius: 8px;
    outline: none;
    border: none;
    background-color: rgb(255, 255, 255, 0.1);
    color: white;
    transition: 0.25s;


}
.input-box > input:focus{
    border: solid 2px rgb(255, 255, 255, 0.5);
}
.input-box > input::placeholder{
    color: rgb(255, 255, 255, 0.5);
}
.input-box > input::-ms-reveal{
    filter: invert(100%);
}
.input-box i{
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: rgb(255, 255, 255, 0.5);
    cursor: pointer;
    transition: 0.25s;
}

.input-box > input:focus + i{
    color: white;
}

.remember-forgot-box{
    display: flex;
    width: 100%;
    margin-top: 16px;
    justify-content: space-between;
}

.remember-forgot-box > h5{
    font-size: 14px;
    color: rgb(255, 255, 255, 0.5);
    font-weight: normal;

}

.remember-me{
    display: flex;
    gap: 8px;
}

.forgot-password{
    color: rgba(255, 255, 255, 0.685);
    font-size: 14px;
    text-decoration: none;
}

.forgot-password:hover{
    text-decoration: underline;
}

.login-btn{
    width: 50%;
    padding: 12px 16px;
    border-radius: 8px;
    outline: none;
    border: none;
    background-color: rgb(255, 255, 255, 0.1);
    color: white;
    font-weight: bold;
    margin-top: 24px;
    cursor: pointer;
    transition: 0.25s;
    background: #32cdd5;

}
.login-btn:focus{
    outline: #32cdd58a 3px solid;

}

.login-btn:hover{
    background: #32cdd5a1;
}

.dont-have-an-account{
    font-weight: normal;
    margin-top: 12px;
}

.dont-have-an-account > a{
    color: rgb(255, 255, 255, 0.5);
    text-decoration: none;
}
.dont-have-an-account > a:hover{
    text-decoration: underline;
}

@media (max-width: 650px) {
  body {
    flex-direction: column;
  }

  .left {
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 360px;
  }

  .right {
    border-radius: 0 0 16px 16px;
    width: 100%;
    max-width: 360px;
    border-left: 1px solid rgba(255, 255, 255, 0.25);
    border-top: none;
  }
}
    </style>
</head>
<body>
    <h1 class="form-header">Mawingu Wi-Fi</h1>
    <div class="designer">
        <h2 class="designer-name">Designed by Narok Lemashon</h2>
        <p class="designer-credit">Crafted by Narok Lemashon. Designed to offer Mawingu customers a simple, secure, and effortless entry point to high-speed internet, keeping your online journey smooth from the very first click.</p>
    </div>
    <form class="container">
        <h1 class="login-title">Login</h1>

        <section class="input-box">
            <input type="text" name="username" placeholder="Username" required>
            <i class="bx bxs-user"></i>
        </section>
        <section class="input-box">
            <input type="password" name="password" placeholder="Password" required>
            <i class="bx bxs-lock-alt"></i>
        </section>

        <section class="remember-forgot-box">
            <div class="remember-me">
            <input type="checkbox" name="remember-me" id="remember-me">
            <label for="remember-me">
                <h5>Remember me</h5>
            </label>
         </div>
         <a class="forgot-password" href="">
            <h5>Forgot Password?</h5>
         </a>
        </section>
        <button class="login-btn" type="submit">
            Login
        </button>

        <h5 class="dont-have-an-account">
            Don't have an account? <a href="register.html"><b>Register</b></a>
        </h5>
    </form>
</body>
</html>
