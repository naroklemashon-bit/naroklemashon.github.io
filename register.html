<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
/* Reset & Base Styles */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #a3bded 0%, #6991c7 100%);
  padding: 20px;
}

/* Card Wrapper Layout */
body {
  flex-direction: row;
}

/* Parent container combining left and right sections */
body > .left,
body > .right {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  color: #fff;
  padding: 40px 30px;
}

/* Left Section (Form) */
.left {
  border-radius: 16px 0 0 16px;
  width: 340px;
}

/* Right Section (Buttons & Social Links) */
.right {
  border-radius: 0 16px 16px 0;
  width: 300px;
  border-left: 1px solid rgba(255, 255, 255, 0.2);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}

/* Form Styles */
.signup {
  font-size: 1.8rem;
  margin-bottom: 25px;
  text-align: center;
  color: #fff;
}

.input-box {
  position: relative;
  margin-bottom: 18px;
  width: 100%;
}

.input-box input {
  width: 100%;
  padding: 12px 40px 12px 15px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  background: rgba(255, 255, 255, 0.2);
  color: #fff;
  font-size: 0.95rem;
  outline: none;
  transition: border-color 0.3s ease;
}

.input-box input::placeholder {
  color: rgba(255, 255, 255, 0.75);
}

.input-box input:focus {
  border-color: #00e5ff;
}

.input-box i {
  position: absolute;
  right: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 1.2rem;
  color: rgba(255, 255, 255, 0.8);
}

/* Right Section Buttons & Links */
.signup-btn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background-color: #00e5ff;
  color: #0d274c;
  font-weight: bold;
  font-size: 1rem;
  cursor: pointer;
  margin-bottom: 15px;
  transition: background 0.3s ease;
}

.signup-btn:hover {
  background-color: #00b3ca;
}

.right p {
  font-size: 0.9rem;
  color: #fff;
}

.right p a {
  color: #00e5ff;
  text-decoration: none;
  font-weight: bold;
}

.right p a:hover {
  text-decoration: underline;
}

/* Social Buttons */
.sign-google,
.sign-Apple {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.4);
  font-size: 0.9rem;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.3s ease, color 0.3s ease;
}

.sign-google {
  background: rgba(255, 255, 255, 0.9);
  color: #333;
}

.sign-google:hover {
  background: #beb2b2;
}

.sign-Apple {
  background: #000000;
  color: #fff;
  border: none;
}

.sign-Apple:hover {
  background: #585555;
}

/* Responsive Layout for Mobile Devices */
@media (max-width: 650px) {
  body {
    flex-direction: column;
  }

  .left {
    border-radius: 16px 16px 0 0;
    width: 100%;
    max-width: 360px;
  }

  .right {
    border-radius: 0 0 16px 16px;
    width: 100%;
    max-width: 360px;
    border-left: 1px solid rgba(255, 255, 255, 0.25);
    border-top: none;
  }
}
    </style>
</head>
<body>
    <div class="left">
    <form class="container">
        <h1 class="signup">Sign Up Now</h1>
        <section class="input-box">
            <input type="text" name="username" placeholder="Full Name" required>
            <i class="bx bxs-user"></i>
        </section>
        <section class=input-box>
            <input type="text" name="email" placeholder="Email" required>
            <i class="bx bxs-envelope"></i>
        </section>
        <section class="input-box">
            <input type="password" name="password" placeholder="Password" required>
            <i class="bx bxs-lock"></i>
        </section>
        <section class="input-box">
            <input type="text" name="confirm-password" placeholder="Confirm Password" required>
            <i class="bx bxs-lock"></i>
        </section>
    </form>
    </div>
    <div class="right">
        <button class="signup-btn">Sign Up</button>
        <p>Already have an account? <a href="index.html">Login</a></p>
        <br />
        Or
        <br />
        <button class="sign-google">Sign Up with Google</button>
        <button class="sign-Apple">Sign Up with Apple</button>
    </div>
</body>
</html>
